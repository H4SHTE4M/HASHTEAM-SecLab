name: CI and production deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR 验证可以被新提交取代；main 的生产发布不得在中途被取消。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha256: ${{ steps.package_release.outputs.release_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install VM test dependency
        run: sudo apt-get update && sudo apt-get install --yes busybox-static

      - name: Run complete release verification
        run: bash scripts/verify-build.sh

      - name: Package verified production release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: package_release
        shell: bash
        run: |
          set -euo pipefail
          release_archive="$RUNNER_TEMP/hashteam-production-release.tar"
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -cf "$release_archive" \
            .

          release_sha256="$(sha256sum "$release_archive" | cut -d ' ' -f 1)"
          [[ "$release_sha256" =~ ^[a-f0-9]{64}$ ]]
          printf 'release_sha256=%s\n' "$release_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified production release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-${{ github.sha }}
          path: ${{ runner.temp }}/hashteam-production-release.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: hashteam-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified production release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-release-${{ github.sha }}
          path: ${{ runner.temp }}/production-release

      - name: Verify and extract production release
        shell: bash
        env:
          EXPECTED_RELEASE_SHA256: ${{ needs.verify.outputs.release_sha256 }}
        run: |
          set -euo pipefail
          release_archive="$RUNNER_TEMP/production-release/hashteam-production-release.tar"
          bash scripts/verify-release-archive.sh \
            "$release_archive" \
            "$EXPECTED_RELEASE_SHA256" \
            "$GITHUB_SHA"

      - name: Install deployment transport
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync

      # 此步骤之后不再运行任何第三方 Action。私钥只存在于本步骤环境和
      # runner 临时文件中，并在步骤退出时由 trap 删除。
      - name: Deploy atomically and verify production
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT }}
          DEPLOY_HOSTNAME: ${{ vars.DEPLOY_HOSTNAME }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail

          : "${DEPLOY_SSH_PRIVATE_KEY:?missing production SSH private key}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?missing pinned SSH host key}"
          : "${DEPLOY_KEY_FINGERPRINT:?missing deployment key fingerprint}"
          : "${DEPLOY_HOSTNAME:?missing deployment hostname}"
          : "${DEPLOY_PORT:?missing deployment port}"
          : "${DEPLOY_USER:?missing deployment user}"
          : "${DEPLOY_PATH:?missing deployment path}"
          : "${DEPLOY_URL:?missing deployment URL}"

          [[ "$DEPLOY_HOSTNAME" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          deploy_port_decimal="$((10#$DEPLOY_PORT))"
          (( deploy_port_decimal >= 1 && deploy_port_decimal <= 65535 ))
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_KEY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+$ ]]

          ssh_dir="$HOME/.ssh"
          private_key_file="$ssh_dir/hashteam-production"
          known_hosts_file="$ssh_dir/hashteam-production-known-hosts"
          ssh_config_file="$ssh_dir/config"

          cleanup_deploy_credentials() {
            unset DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS
            if [[ -f "$private_key_file" ]]; then
              unlink "$private_key_file"
            fi
          }
          trap cleanup_deploy_credentials EXIT

          umask 077
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$private_key_file"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 0600 "$private_key_file" "$known_hosts_file"

          actual_key_fingerprint="$(
            ssh-keygen -y -f "$private_key_file" |
              ssh-keygen -lf - |
              awk '{print $2}'
          )"
          [[ "$actual_key_fingerprint" == "$DEPLOY_KEY_FINGERPRINT" ]] || {
            echo "ERROR: GitHub Secret 中的部署私钥指纹不匹配" >&2
            exit 1
          }
          ssh-keygen \
            -F "[$DEPLOY_HOSTNAME]:$DEPLOY_PORT" \
            -f "$known_hosts_file" \
            >/dev/null

          cat > "$ssh_config_file" <<SSH_CONFIG
          Host hashteam-production
              HostName $DEPLOY_HOSTNAME
              Port $DEPLOY_PORT
              User $DEPLOY_USER
              IdentityFile $private_key_file
              IdentitiesOnly yes
              BatchMode yes
              ConnectTimeout 15
              ServerAliveInterval 15
              ServerAliveCountMax 4
              StrictHostKeyChecking yes
              UserKnownHostsFile $known_hosts_file
              LogLevel ERROR
          SSH_CONFIG
          chmod 0600 "$ssh_config_file"

          unset DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS

          DEPLOY_HOST=hashteam-production \
          DEPLOY_EXPECTED_USER="$DEPLOY_USER" \
          DEPLOY_PATH="$DEPLOY_PATH" \
          DEPLOY_URL="$DEPLOY_URL" \
            timeout --signal=TERM --kill-after=90s 42m \
              bash scripts/deploy-release.sh

  deploy_edgeone:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://lab.lwzheng.tech
    concurrency:
      group: hashteam-edgeone-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19'
          cache: pnpm

      - name: Install locked deployment CLI
        run: pnpm install --frozen-lockfile

      - name: Download verified production release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-release-${{ github.sha }}
          path: ${{ runner.temp }}/production-release

      - name: Verify and extract production release
        shell: bash
        env:
          EXPECTED_RELEASE_SHA256: ${{ needs.verify.outputs.release_sha256 }}
        run: |
          set -euo pipefail
          release_archive="$RUNNER_TEMP/production-release/hashteam-production-release.tar"
          bash scripts/verify-release-archive.sh \
            "$release_archive" \
            "$EXPECTED_RELEASE_SHA256" \
            "$GITHUB_SHA"

      # 此步骤之后不再运行任何第三方 Action。Token 只注入本步骤，CLI
      # 返回后立即从环境删除，再执行不含凭据的自定义域名验收。
      - name: Deploy EdgeOne Production and verify custom domain
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PAGES_API_REGION: china
          EDGEONE_PROJECT_NAME: seclabtest
          EDGEONE_PROJECT_ID: makers-iehfqellwnxf
          EDGEONE_DEPLOY_URL: https://lab.lwzheng.tech
          EXPECTED_SOURCE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          edgeone_phase=deploy
          cleanup_edgeone_token() {
            status=$?
            trap - EXIT
            unset EDGEONE_API_TOKEN EDGEONE_PAGES_API_TOKEN
            if [[ "$status" -ne 0 && "$edgeone_phase" == "deploy" ]]; then
              echo "ERROR: EdgeOne Production 发布失败。" >&2
              echo "恢复：在 Makers 控制台手工重部署 seclabtest 的上一成功 Production 版本；Nginx 主站未受影响。" >&2
            fi
            exit "$status"
          }
          trap cleanup_edgeone_token EXIT

          : "${EDGEONE_API_TOKEN:?missing EdgeOne production API token}"
          node scripts/verify-edgeone-project.mjs
          NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/guard-edgeone-project.mjs" \
          pnpm exec edgeone makers deploy dist \
            -n "$EDGEONE_PROJECT_NAME" \
            -e production \
            -t "$EDGEONE_API_TOKEN"

          unset EDGEONE_API_TOKEN EDGEONE_PAGES_API_TOKEN
          edgeone_phase=verify
          bash scripts/verify-edgeone-production.sh
