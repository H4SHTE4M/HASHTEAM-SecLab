name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install VM test dependency
        run: sudo apt-get update && sudo apt-get install --yes busybox-static

      - name: Run unit and component tests
        run: pnpm test

      - name: Run VM shell checks
        run: pnpm test:vm

      - name: Run real VM integration test
        run: pnpm test:integration

      - name: Build production bundle
        run: pnpm build
